<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Noddle">
	<title>Noddle</title>
	<rect width="512" height="512" rx="112" fill="#020617" />
	<!-- The nod: down and back up, around the tile's top. -->
	<path d="M 92 176 A 190 190 0 0 1 420 176" fill="none" stroke="#34d399" stroke-width="30" stroke-linecap="round" />
	<path d="M 420 176 L 432 118 M 420 176 L 362 172" fill="none" stroke="#34d399" stroke-width="30" stroke-linecap="round" />
	<!-- A letter tile with a face, tipped forward mid-nod. -->
	<g transform="translate(0 18) rotate(-7 256 300)">
		<rect x="116" y="150" width="280" height="290" rx="52" fill="#b45309" transform="translate(0 16)" />
		<rect x="116" y="150" width="280" height="290" rx="52" fill="#fcd34d" />
		<circle cx="196" cy="290" r="28" fill="#0f172a" />
		<circle cx="316" cy="290" r="28" fill="#0f172a" />
		<path d="M 186 358 Q 256 416 326 358" fill="none" stroke="#0f172a" stroke-width="26" stroke-linecap="round" />
	</g>
</svg>
