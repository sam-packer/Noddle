<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Noddle">
	<title>Noddle</title>
	<defs>
		<linearGradient id="noddle-bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#6366f1" />
			<stop offset="1" stop-color="#3730a3" />
		</linearGradient>
	</defs>
	<rect width="512" height="512" rx="112" fill="url(#noddle-bg)" />
	<!-- A letter tile, tipped forward mid-nod. -->
	<g transform="rotate(8 256 256)">
		<rect x="118" y="126" width="276" height="276" rx="44" fill="#c7b299" />
		<rect x="118" y="110" width="276" height="276" rx="44" fill="#fbf5e9" />
		<path d="M 192 318 V 180 L 320 318 V 180" fill="none" stroke="#312e81" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" />
	</g>
</svg>
